name: Integrated quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: navegacao_indoor_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'mysql' && 'mysql+pymysql://root:root@127.0.0.1:3306/navegacao_indoor_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: pip install -r services/api/requirements.txt
      # Os builds servidos pela API não são versionados. Gere o painel antes
      # dos testes que validam /admin e o fallback de rotas da SPA.
      - run: npm ci --prefix apps/admin
      - run: npm run build --prefix apps/admin
      - run: pytest services/api/tests -v
        env:
          DATABASE_URL: "sqlite:///./test.db"
          ADMIN_API_KEY: "audit-local-admin-key-with-32-characters"
          SECRET_KEY: "audit-local-only"
          ADMIN_API_KEYS: "{}"

  blender:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shopping-3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check tests scripts utils/mesh_data.py config.py utils/geometry.py navigation.py ../scene-contract
      - run: ruff format --check tests scripts utils/mesh_data.py
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - name: Install Blender via apt
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Existing generation smoke test
        run: blender --background --factory-startup --python-exit-code 1 --python scripts/blender_smoke.py
      - name: Physical navigation and GLB export
        run: |
          blender --background --factory-startup --python-exit-code 1 --python scripts/validate_navigation_geometry.py
          blender --background --factory-startup --python-exit-code 1 --python scripts/export_navigation_scene.py -- --output ../../.work/ci-scene
      - uses: actions/upload-artifact@v4
        with:
          name: generated-navigation-scene
          include-hidden-files: true
          path: |
            .work/ci-scene
            evidence/navigation-geometry.json

  frontends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/visitor/package-lock.json
            apps/admin/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r services/api/requirements.txt
      - name: Visitor web and native isolation
        working-directory: apps/visitor
        run: |
          npm ci
          npm run typecheck
          npm run build:web
          npm run build:native
      - name: Admin build and browser
        id: admin-build
        working-directory: apps/admin
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Seed banco de teste com piso superior
        working-directory: apps/admin
        env:
          DATABASE_URL: "sqlite:///./test.db"
          ADMIN_API_KEY: "audit-local-admin-key-with-32-characters"
          SECRET_KEY: "audit-local-only"
          ADMIN_API_KEYS: "{}"
        run: python ../../services/api/seed_database.py --env ci --include-floors || true
      - name: Verificar piso superior no banco de teste
        working-directory: apps/admin
        env:
          DATABASE_URL: "sqlite:///./test.db"
          ADMIN_API_KEY: "audit-local-admin-key-with-32-characters"
          SECRET_KEY: "audit-local-only"
          ADMIN_API_KEYS: "{}"
        run: |
          python ../../services/api/seed_database.py --env ci --include-floors || true
          python - <<'PY'
          import sys
          sys.path.insert(0, "../../services/api")
          from app.database import SessionLocal, engine
          from app.models import Piso, No, QRCode, Shopping
          db = SessionLocal()
          demo = db.query(Shopping).filter_by(nome="Shopping Demo Center").first()
          if not demo:
            print("ERRO: Shopping Demo Center nao encontrado"); sys.exit(1)
          upper = db.query(Piso).filter_by(shopping_id=demo.id, nivel=1).first()
          if not upper:
            print("ERRO: Piso superior nao encontrado"); sys.exit(1)
          dest = db.query(No).filter_by(nome="Livraria Superior", piso_id=upper.id).first()
          if not dest:
            print("ERRO: Livraria Superior nao encontrada"); sys.exit(1)
          qr = db.query(QRCode).filter_by(no_id=dest.id, token="DESTINO-SUPERIOR").first()
          if not qr:
            print("ERRO: QR code DESTINO-SUPERIOR nao encontrado"); sys.exit(1)
          print("OK: Piso superior, Livraria Superior e QR DESTINO-SUPERIOR presentes no banco de teste.")
          db.close()
          PY
      - name: Existing E2E regression
        working-directory: apps/admin
        env:
          AUDIT_REPORT: ../../evidence/regression-browser-tests.json
          AUDIT_ARTIFACTS: ../../evidence/regression-browser-artifacts
          DATABASE_URL: "sqlite:///./test.db"
          ADMIN_API_KEY: "audit-local-admin-key-with-32-characters"
          SECRET_KEY: "audit-local-only"
          ADMIN_API_KEYS: "{}"
        run: |
          python ../../services/api/audit_server.py --port 8765 > .work-audit-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8765/health && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8765/health
          npm run test:e2e -- --project=chromium tests/navigation.spec.ts tests/scanner.spec.ts tests/admin-crud.spec.ts tests/multiuser.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-logs
          path: |
            apps/admin/.work-audit-server.log
            evidence/regression-browser-artifacts/**
      # Não usa continue-on-error: a suíte roda mesmo se a legada falhar, mas o
      # job termina falho se qualquer uma das duas falhar.
      - name: Integrated 3D E2E
        if: always() && steps.admin-build.outcome == 'success'
        working-directory: apps/admin
        env:
          AUDIT_URL: http://127.0.0.1:8766
          AUDIT_REPORT: ../../evidence/integration-browser-tests.json
          AUDIT_ARTIFACTS: ../../evidence/integration-browser-artifacts
          DATABASE_URL: "sqlite:///./test.db"
          ADMIN_API_KEY: "audit-local-admin-key-with-32-characters"
          SECRET_KEY: "audit-local-only"
          ADMIN_API_KEYS: "{}"
        run: |
          python ../../services/api/mini_server.py --port 8766 > .work-mini-server.log 2>&1 &
          server_pid=$!
          CI=1 EXPO_PUBLIC_API_URL=http://127.0.0.1:8766 npm --prefix ../visitor run web -- --port 8081 > .work-visitor-web.log 2>&1 &
          visitor_pid=$!
          trap 'kill $visitor_pid $server_pid' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8766/health && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8766/health
          # O servidor web do Expo (Metro) pode demorar mais que 30s a ficar
          # disponível em execução fria (bind de porta 8081). Aguarda até 120s
          # antes de seguir para os testes, evitando ERRO_CONNECTION_REFUSED
          # por corrida de disponibilidade.
          for attempt in $(seq 1 120); do curl --fail --silent http://127.0.0.1:8081 && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8081
          npm run test:e2e -- --project=chromium tests/scene.spec.ts tests/map-interactions.spec.ts tests/visitor-journey.spec.ts tests/visitor-experience.spec.ts tests/business-rules.spec.ts tests/layout-accessibility.spec.ts tests/wayfinding.spec.ts tests/waze-navigation.spec.ts tests/simulation-engine.spec.ts tests/simulation-rerouting.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-logs
          path: |
            apps/admin/.work-visitor-web.log
            apps/admin/.work-mini-server.log
            evidence/integration-browser-artifacts/**
      # Auditoria de acessibilidade automatizada (axe-core WCAG 2.2 AA) sobre
      # o visitante público e o painel admin, contra o mini_server já validado.
      - name: Accessibility audit (axe-core WCAG 2.2 AA)
        if: always() && steps.admin-build.outcome == 'success'
        working-directory: apps/admin
        env:
          AUDIT_URL: http://127.0.0.1:8766
          AUDIT_REPORT: ../../evidence/accessibility-browser-tests.json
          AUDIT_ARTIFACTS: ../../evidence/accessibility-browser-artifacts
          DATABASE_URL: "sqlite:///./test.db"
          ADMIN_API_KEY: "audit-local-admin-key-with-32-characters"
          SECRET_KEY: "audit-local-only"
          ADMIN_API_KEYS: "{}"
        run: |
          python ../../services/api/mini_server.py --port 8766 > .work-accessibility-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8766/health && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8766/health
          npx playwright test --project=chromium tests/accessibility.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-logs
          path: |
            apps/admin/.work-accessibility-server.log
            evidence/accessibility-browser-artifacts/**
      # A auditoria do catálogo calcula 104 rotas (26 destinos × 2 modos × 2
      # sentidos). O limite de produção continua 30/60 s; a cota maior vale
      # apenas para este processo isolado, em porta própria.
      - name: Catalog E2E with isolated route quota
        if: always() && steps.admin-build.outcome == 'success'
        working-directory: apps/admin
        env:
          AUDIT_URL: http://127.0.0.1:8767
          AUDIT_REPORT: ../../evidence/catalog-browser-tests.json
          AUDIT_ARTIFACTS: ../../evidence/catalog-browser-artifacts
          DATABASE_URL: "sqlite:///./test.db"
          ADMIN_API_KEY: "audit-local-admin-key-with-32-characters"
          SECRET_KEY: "audit-local-only"
          ADMIN_API_KEYS: "{}"
        run: |
          mkdir -p ../../evidence
          ROUTES_RATE_LIMIT=200 python ../../services/api/mini_server.py --port 8767 > ../../evidence/catalog-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8767/health && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8767/health
          set +e
          npm run test:e2e -- --project=chromium tests/simulation-catalog.spec.ts
          status=$?
          set -e
          echo "simulation-catalog exit code: $status"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: evidence
